[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-cascade-stereograph"
version = "0.3.0"
description = "Ion Cascade's MCP server for Blender"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==1.30.0"]

[project.scripts]
stereograph = "stereograph.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stereograph_bridge = ["blender_manifest.toml"]
